<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef1f5">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Iron Log – Workout Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1f5; --card:#ffffff; --ink:#101828; --mute:#667085; --line:#dde2ea;
  --accent:#2457ff; --accent-ink:#ffffff; --accent-soft:#e6ecff;
  --good:#12803c; --bad:#d92d3a; --chip:#e3e8f0;
  --shadow:0 1px 2px rgba(16,24,40,.06);
  --head:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#12151c; --card:#1b1f29; --ink:#eef1f6; --mute:#9aa3b5; --line:#2b3140;
    --accent:#6b8cff; --accent-ink:#0b1020; --accent-soft:#232c4d;
    --good:#4cd07d; --bad:#ff6b76; --chip:#262c3a; --shadow:none;
    color-scheme:dark;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:84px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.4 var(--body);
  padding-bottom:calc(200px + env(safe-area-inset-bottom,0px));
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
h1,h2,h3{margin:0;font-family:var(--head);font-weight:700;letter-spacing:.01em}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* header */
#top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;display:flex;align-items:center;gap:8px}
.plan{flex:1;min-width:0;text-align:left;padding:4px 0}
.plan small{display:block;color:var(--mute);font-size:12px}
.plan b{display:block;font:700 24px/1.1 var(--head);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:44px;height:44px;border-radius:12px;background:var(--chip);font-size:19px;display:grid;place-items:center;flex:none}
.ib.on{background:var(--accent);color:var(--accent-ink)}
.wrap{max-width:720px;margin:0 auto;padding:12px 14px}

/* overview */
.ov{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.ovt{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.ovt .big{font:700 40px/1 var(--head)}
.ovt .big{white-space:nowrap}
.ovt .big span{font-size:16px;color:var(--mute)}
.mode{font-size:13px;font-weight:600;padding:5px 10px;border-radius:99px;background:var(--chip);color:var(--mute)}
.sync{font-size:12px;color:var(--mute);margin-top:5px;min-height:16px}
.mode.edit{background:var(--accent-soft);color:var(--accent)}
.bar{height:8px;background:var(--chip);border-radius:9px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:9px;transition:width .25s}
.bar.full i{background:var(--good)}
.ovb{display:flex;gap:8px;margin-top:12px}
.btn{min-height:44px;padding:0 16px;border-radius:12px;font-weight:600;background:var(--chip)}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--bad);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.ovb .btn{flex:1}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:38px;padding:0 14px;border-radius:99px;background:var(--chip);font-weight:500;font-size:14px}
.chip.on{background:var(--ink);color:var(--bg)}

/* sections */
.sec{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-top:12px;overflow:hidden;box-shadow:var(--shadow)}
.sh{display:flex;align-items:center;gap:8px;padding:12px 8px 12px 14px;cursor:pointer;user-select:none}
.sh .t{flex:1;min-width:0}
.sh h2{font-size:26px;line-height:1.1}
.sh small{color:var(--mute);font-size:13px}
.sh .bar{margin-top:6px;height:5px}
.car{width:28px;text-align:center;color:var(--mute);transition:transform .2s}
.sec.closed .car{transform:rotate(-90deg)}
.sec.closed .sb{display:none}
.sb{border-top:1px solid var(--line)}
.ex{padding:12px 14px 10px;border-bottom:1px solid var(--line)}
.ex:last-of-type{border-bottom:0}
.eh{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.en{flex:1;font-weight:600;min-width:0}
.vid{flex:none;display:inline-flex;align-items:center;min-height:32px;padding:0 11px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:600;text-decoration:none}
.ec{font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.ex.alldone .en{color:var(--good)}
.ex.alldone .ec{color:var(--good);font-weight:600}
.eh .ib{width:36px;height:36px;font-size:16px;background:transparent;color:var(--mute)}

/* sets */
.set{display:grid;grid-template-columns:44px 1fr 1fr;grid-template-areas:"c w r" ". h h";column-gap:8px;align-items:center;padding:4px 0}
.chk{grid-area:c;width:44px;height:44px;border-radius:12px;border:2px solid var(--line);display:grid;place-items:center;font-size:22px;font-weight:700;color:transparent;background:var(--card);transition:background .12s,border-color .12s}
.set.done .chk{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.fld{position:relative;display:block}
.fld.w{grid-area:w}.fld.r{grid-area:r}
.fld input{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 44px 0 12px;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.fld input::placeholder{color:var(--mute);opacity:.55;font-weight:400}
.fld input:read-only{background:transparent;border-color:transparent;padding-left:2px}
.fld em{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-style:normal;font-size:13px;color:var(--mute);pointer-events:none}
.set.done .fld input{color:var(--mute)}
.hint{grid-area:h;font-size:12px;color:var(--mute);min-height:0;padding:2px 0 0 2px;font-variant-numeric:tabular-nums}
.hint:empty{display:none}
.up{color:var(--good)}.dn{color:var(--bad)}
.ef{display:flex;gap:8px;margin-top:6px}
.ef .btn{min-height:36px;font-size:14px;padding:0 12px}
.add{display:block;width:calc(100% - 28px);margin:12px 14px;min-height:44px;border:1.5px dashed var(--line);border-radius:12px;color:var(--accent);font-weight:600}
.addsec{display:block;width:100%;margin-top:14px;min-height:52px;border:1.5px dashed var(--accent);border-radius:16px;color:var(--accent);font-weight:600}
.empty{text-align:center;color:var(--mute);padding:36px 12px}

.grip{flex:none;width:30px;height:44px;display:grid;place-items:center;color:var(--mute);touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;border-radius:8px}
.ex .grip{width:28px;height:36px}
.day{flex:none;font-size:13px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--chip);color:var(--mute)}
.day.today{background:var(--accent);color:var(--accent-ink)}
.schk{flex:none;width:40px;height:40px;border-radius:12px;border:2px solid var(--line);display:grid;place-items:center;font-size:20px;font-weight:700;color:transparent;background:var(--card);transition:background .12s,border-color .12s}
.schk.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.schk.part{border-color:var(--accent);color:var(--accent)}
.dragging{position:relative;z-index:15;background:var(--card);box-shadow:0 10px 28px rgba(0,0,0,.28);border-radius:14px}
.sec.dragging{border-color:var(--accent)}
.sorting .sb{display:none}
body.dragging-ex .sec{overflow:visible}
body.dragging-sec,body.dragging-ex{user-select:none;-webkit-user-select:none}
.dropline{position:fixed;height:4px;border-radius:4px;background:var(--accent);z-index:40;pointer-events:none}
.tabs{display:flex;gap:4px;background:var(--chip);border-radius:14px;padding:4px;margin-bottom:12px}
.tab{flex:1;min-height:40px;border-radius:11px;font-weight:600;color:var(--mute)}
.tab.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px;box-shadow:var(--shadow)}
.panel h3{font-size:22px;margin-bottom:2px}
.panel .mute,.mute{color:var(--mute);font-size:13px;margin:4px 0 0}
.prow{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--shadow)}
.pc small{display:block;color:var(--mute);font-size:12px}
.pc .big{display:block;font:700 30px/1.1 var(--head);margin:2px 0}
.pc b.up,.pc b.dn,.pc b{font-size:12px;font-weight:600}
.bars{display:flex;align-items:flex-end;gap:5px;height:150px;margin-top:12px}
.bc{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.bb{width:100%;max-width:36px;background:var(--accent);opacity:.55;border-radius:6px 6px 2px 2px;min-height:3px}
.bc.cur .bb{opacity:1}
.bb.z{background:var(--chip);opacity:1}
.bv{font-size:10px;color:var(--mute);height:14px;line-height:14px;font-variant-numeric:tabular-nums}
.bl{font-size:11px;color:var(--mute);height:16px;line-height:16px;white-space:nowrap}
.seg{display:flex;gap:6px;margin-top:10px}
.seg .chip{min-height:34px;font-size:13px;padding:0 12px}
.mr{display:grid;grid-template-columns:96px 1fr auto;gap:10px;align-items:center;margin:10px 0 0;font-size:14px}
.mr span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.mt{height:10px;background:var(--chip);border-radius:6px;overflow:hidden}
.mt i{display:block;height:100%;background:var(--accent);border-radius:6px}
.mr em{font-style:normal;color:var(--mute);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.sel{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 12px;font-weight:600;margin-top:10px}
.lc{width:100%;height:auto;margin-top:8px;display:block}
.lc text{fill:var(--mute);font-size:10px;font-family:var(--body)}
.lc .gl{stroke:var(--line);stroke-width:1}
.lc .ln{stroke:var(--accent);fill:none;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.lc circle{fill:var(--card);stroke:var(--accent);stroke-width:2}
.lc circle.pr{fill:var(--good);stroke:var(--good)}
.st3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.st3 div{background:var(--bg);border-radius:12px;padding:8px 10px}
.st3 small{display:block;color:var(--mute);font-size:11px}
.st3 b{font:700 20px/1.2 var(--head)}
.srow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.srow .a{flex:1;min-width:0}
.srow .a b{display:block;font-size:14px}
.srow .a small{color:var(--mute);font-size:12px}
.srow .r{text-align:right;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.srow .ib{width:36px;height:36px;font-size:15px;background:transparent;color:var(--mute)}
.prl{font-size:14px;padding:7px 0;border-bottom:1px solid var(--line)}
.prl:last-child{border-bottom:0}
.prl small{color:var(--mute)}
/* rest bar */
#rest{position:fixed;left:10px;right:10px;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:30;transform:translateY(250%);transition:transform .2s;
  padding:12px 14px;border-radius:16px;background:var(--ink);color:var(--bg);box-shadow:0 8px 24px rgba(0,0,0,.25)}
#rest.show{transform:none}
#rest .row{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:10px}
#rest .time{font:700 44px/1 var(--head);min-width:92px;font-variant-numeric:tabular-nums}
#rest .lbl{font-size:13px;opacity:.7}
#rest .prog{flex:1;height:6px;border-radius:9px;background:rgba(127,127,127,.35);overflow:hidden}
#rest .prog i{display:block;height:100%;background:var(--accent);width:100%;transition:width .25s linear}
#rest button{min-height:40px;padding:0 12px;border-radius:10px;background:rgba(127,127,127,.3);font-weight:600;color:inherit}
#rest.done .time{color:#6ee79a}

/* sheets & modals */
.bg{position:fixed;inset:0;z-index:50;background:rgba(10,14,24,.5);display:flex;align-items:center;justify-content:center;padding:16px 16px calc(90px + env(safe-area-inset-bottom,0px));animation:fade .15s}
@keyframes fade{from{opacity:0}}
.md,.sheet{background:var(--card);width:100%;max-width:520px;padding:18px 16px 16px;
  border-radius:20px;max-height:calc(100vh - 140px);max-height:calc(100dvh - 140px);overflow:auto;animation:up .18s}
@keyframes up{from{transform:translateY(24px);opacity:.6}}
.md h3,.sheet h3{font-size:26px;margin-bottom:10px}
.md p{color:var(--mute);margin:0 0 12px}
.md label.f{display:block;margin-bottom:12px;font-size:14px;font-weight:600}
.md label.f input,.md label.f select,.md label.f textarea{display:block;width:100%;margin-top:6px;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 12px;font-weight:400;font-size:16px}
.md label.f.cb{display:flex;align-items:center;gap:10px;font-weight:400}
.md label.f.cb input{width:22px;height:22px;margin:0}
.md code,.md textarea{font-family:ui-monospace,Menlo,monospace;font-size:12px}
.md textarea{height:90px!important;padding:8px 12px!important}
.err{color:var(--bad);font-size:14px;margin:0 0 10px;font-weight:600}
.mb{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.mb .btn{flex:1}
.si{display:flex;align-items:center;gap:12px;width:100%;min-height:50px;padding:0 6px;text-align:left;font-weight:500;border-radius:10px;border-bottom:1px solid var(--line)}
.si:last-child{border-bottom:0}
.si.danger{color:var(--bad)}
.si.on{color:var(--accent);font-weight:600}
.si span.ic{width:26px;text-align:center}
.hist{font-size:14px;border-bottom:1px solid var(--line);padding:9px 0;display:flex;justify-content:space-between;gap:10px}
.hist small{color:var(--mute);display:block}
#toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:500;z-index:60;max-width:90vw;text-align:center;transition:.2s}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header id="top"></header>
<main class="wrap" id="app"></main>
<div id="rest" aria-live="polite">
  <div class="row">
    <div><div class="time" id="restTime">1:00</div><div class="lbl" id="restLbl">Rest</div></div>
    <div class="prog"><i id="restBar"></i></div>
    <button id="restMinus" aria-label="Subtract 15 seconds">−15</button>
    <button id="restPlus" aria-label="Add 15 seconds">+15</button>
    <button id="restSkip">Skip</button>
  </div>
</div>
<div id="toast" role="status"></div>
<noscript><p style="padding:20px">This dashboard needs JavaScript.</p></noscript>

<script>
/* ============================================================
   CONFIG
   The edit password lives on the server (Netlify environment
   variable EDIT_PASSWORD), never in this file.
   SEED_PLAN is only used the first time, before anything has
   been saved to the server.
   ============================================================ */
const API = '/api/data';

const SEED_PLAN = {
  "Chest": ["Incline Barbell Bench Press","Flat Barbell Bench Press","Incline Dumbbell Press","Flat Dumbbell Press","Chest Dips"],
  "Biceps": ["Barbell Curl","Dumbbell Alternating Curl","Preacher Curl (Machine)","Hammer Curl"],
  "Back": ["Barbell Deadlift","Barbell Row","One-Arm Dumbbell Row","Wide-Grip Pull-Up","Lat Pulldown (Wide-Grip / Close-Grip)","T-Bar Row (Barbell / Machine)","Seated Cable Row","Chin-Up","Barbell Shrugs"],
  "Triceps": ["Cable Rope Pushdown","Skull Crushers","Single-Arm Triceps Extension","Overhead Triceps Extension","Triceps Dips"],
  "Glutes": ["Barbell / Dumbbell Hip Thrust","Bulgarian Split Squat","Glute / Butt Blaster Machine"],
  "Shoulders & Traps": ["Dumbbell Lateral Raise","Face Pull","Military Shoulder Press","Dumbbell Shrugs","Leg Press","Leg Extension","Standing Calf Raise"],
  "Abs & Core": ["Cable Crunch","Hanging Leg Raise","Captain's Chair Leg Raise","Ab Roller","Air Bicycle","Flat Bench Lying Leg Raise","Decline Crunch"],
  "Legs": ["Barbell Squat","Hack Squat (Plate-Loaded Sled)","Barbell Front Squat","Leg Press","Barbell Lunge (Walking / Stationary)","Dumbbell Lunge","Romanian Deadlift","Leg Curl (Seated / Lying)","Leg Extension","Standing Calf Raise","Seated Calf Raise","Donkey Calf Raise","Calf Press on Leg Press Machine"]
};

/* ---------- helpers ---------- */
const KEY='ironlog.v1', TOKEN_KEY='ironlog.token', DIRTY_KEY='ironlog.dirty';
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const newSets=n=>Array.from({length:n},()=>({w:'',r:'',pw:'',pr:'',done:false}));
const DAYS=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const todayName=()=>['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][new Date().getDay()];
const dayOptions=()=>[{v:'',t:'No day'},...DAYS.map(d=>({v:d,t:d}))];
const GRIP='<svg width="16" height="20" viewBox="0 0 16 20" fill="currentColor" aria-hidden="true"><circle cx="4" cy="4" r="1.6"/><circle cx="12" cy="4" r="1.6"/><circle cx="4" cy="10" r="1.6"/><circle cx="12" cy="10" r="1.6"/><circle cx="4" cy="16" r="1.6"/><circle cx="12" cy="16" r="1.6"/></svg>';
const fmt=n=>String(Math.round(n*100)/100);

function seedState(){
  const sections=Object.entries(SEED_PLAN).map(([name,list])=>({
    id:uid(),name,collapsed:false,
    exercises:list.map(n=>({id:uid(),name:n,sets:newSets(3)}))
  }));
  const id=uid();
  return {plans:[{id,name:"Coach Thasleem Plan",sections}],activePlan:id,
    settings:{rest:60,unit:'kg',auto:true,sound:true,wake:false},history:[]};
}
function normalize(s){
  if(!s||!Array.isArray(s.plans)||!s.plans.length) return seedState();
  s.settings=Object.assign({rest:60,unit:'kg',auto:true,sound:true,wake:false,goal:4},s.settings||{});
  s.history=Array.isArray(s.history)?s.history:[];
  if(!s.plans.find(p=>p.id===s.activePlan)) s.activePlan=s.plans[0].id;
  return s;
}
let S;
try{ S=normalize(JSON.parse(localStorage.getItem(KEY))); }catch(e){ S=seedState(); }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){ toast('Could not save on this device – storage is full or blocked'); } schedulePush(); }

let unlocked=false, filter='all', token=null;
try{ const t=localStorage.getItem(TOKEN_KEY); if(t&&Number(t.split('.')[0])>Date.now()){ token=t; unlocked=true; } }catch(e){}

const plan=()=>S.plans.find(p=>p.id===S.activePlan);
const unit=()=>S.settings.unit;
function findSec(id){ return plan().sections.find(s=>s.id===id); }
function findEx(id){
  for(const sec of plan().sections){ const i=sec.exercises.findIndex(x=>x.id===id); if(i>-1) return {sec,i,ex:sec.exercises[i]}; }
}
function cleanUrl(u){
  u=(u||'').trim(); if(!u) return '';
  if(!/^https?:\/\//i.test(u)) u='https://'+u;
  try{ const x=new URL(u); return (x.protocol==='http:'||x.protocol==='https:')&&x.hostname.includes('.')?x.href:null; }catch(e){ return null; }
}
function linkLabel(u){
  try{ const h=new URL(u).hostname.replace(/^www\./,'');
    if(/youtu/.test(h)) return 'YouTube'; if(/instagram/.test(h)) return 'Instagram'; if(/tiktok/.test(h)) return 'TikTok';
  }catch(e){}
  return 'Video';
}
function move(arr,i,d){ const j=i+d; if(j<0||j>=arr.length) return false; [arr[i],arr[j]]=[arr[j],arr[i]]; return true; }

/* ---------- server sync + password ---------- */
let syncMsg='', pushT=null, pushing=false, pushAgain=false;
function setSync(m){ syncMsg=m; const el=$('#sync'); if(el) el.textContent=m; }
function schedulePush(){
  if(!unlocked) return;
  try{ localStorage.setItem(DIRTY_KEY,'1'); }catch(e){}
  setSync('Saving…'); clearTimeout(pushT); pushT=setTimeout(push,700);
}
async function push(){
  if(!token) return;
  if(pushing){ pushAgain=true; return; }
  pushing=true; pushAgain=false;
  try{
    const r=await fetch(API,{method:'PUT',headers:{'content-type':'application/json',authorization:'Bearer '+token},body:JSON.stringify(S)});
    if(r.status===401){ expireLogin(); return; }
    if(!r.ok) throw new Error(r.status);
    try{ localStorage.removeItem(DIRTY_KEY); }catch(e){}
    setSync(pushAgain?'Saving…':'Saved to server ✓');
  }catch(e){
    setSync('Offline – will retry'); setTimeout(()=>{ if(unlocked) push(); },8000);
  }finally{
    pushing=false; if(pushAgain){ pushAgain=false; push(); }
  }
}
async function loadServer(manual){
  try{
    const r=await fetch(API,{cache:'no-store'}); if(!r.ok) throw new Error(r.status);
    const d=await r.json();
    let dirty=false; try{ dirty=localStorage.getItem(DIRTY_KEY)==='1'; }catch(e){}
    if(d.state){
      if(unlocked&&(dirty||pushing)){ push(); return; }
      const ns=normalize(d.state);
      if(JSON.stringify(ns)!==JSON.stringify(S)){
        S=ns; try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){}
        render();
      }
      setSync('Synced ✓'); if(manual) toast('Up to date with the server');
    }else{
      if(unlocked){ push(); } else setSync('Nothing saved on the server yet');
    }
  }catch(e){ setSync('Offline – showing saved copy'); if(manual) toast('Can’t reach the server'); }
}
function expireLogin(){
  token=null; unlocked=false; try{ localStorage.removeItem(TOKEN_KEY); }catch(e){}
  setSync('Not saved – unlock again'); render(); toast('Session expired – unlock again to save');
}
function requireUnlock(){
  if(unlocked) return true;
  openUnlock(); return false;
}
function openUnlock(){
  modal({title:'Unlock editing',text:'Enter the password to edit, tick sets or change weights. Without it the plan is view-only.',
    fields:[{name:'pw',label:'Password',type:'password',autocomplete:'current-password'},
            {name:'keep',label:'Keep me unlocked for 30 days on this device',type:'checkbox',value:true}],
    ok:'Unlock',
    onOk:async v=>{
      let r,d;
      try{
        r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:v.pw,keep:v.keep})});
        d=await r.json();
      }catch(e){ return 'Can’t reach the server. Check your connection and try again.'; }
      if(r.status===401) return 'Wrong password. Try again.';
      if(!r.ok||!d.token) return d.error||'Server error. Check that EDIT_PASSWORD is set in Netlify.';
      token=d.token; unlocked=true;
      try{ if(v.keep) localStorage.setItem(TOKEN_KEY,token); else localStorage.removeItem(TOKEN_KEY); }catch(e){}
      render(); toast('Editing unlocked'); loadServer();
    }});
}
function lockNow(){
  token=null; unlocked=false; try{ localStorage.removeItem(TOKEN_KEY); }catch(e){}
  render(); toast('Locked – view only');
}

/* ---------- UI primitives ---------- */
let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2400); }

function modal({title,text,fields=[],ok='Save',danger=false,cancel='Cancel',onOk,hideOk=false}){
  const bg=document.createElement('div'); bg.className='bg';
  const f=fields.map(x=>{
    if(x.type==='checkbox') return `<label class="f cb"><input type="checkbox" name="${x.name}" ${x.value?'checked':''}> ${esc(x.label)}</label>`;
    if(x.type==='select') return `<label class="f">${esc(x.label)}<select name="${x.name}">${x.options.map(o=>`<option value="${esc(o.v)}" ${o.v===x.value?'selected':''}>${esc(o.t)}</option>`).join('')}</select></label>`;
    if(x.type==='textarea') return `<label class="f">${esc(x.label)}<textarea name="${x.name}" readonly>${esc(x.value||'')}</textarea></label>`;
    return `<label class="f">${esc(x.label)}<input name="${x.name}" type="${x.type||'text'}" value="${esc(x.value??'')}" ${x.inputmode?`inputmode="${x.inputmode}"`:''} ${x.autocomplete?`autocomplete="${x.autocomplete}"`:'autocomplete="off"'} ${x.min!=null?`min="${x.min}"`:''} ${x.max!=null?`max="${x.max}"`:''}></label>`;
  }).join('');
  bg.innerHTML=`<form class="md" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h3>${esc(title)}</h3>${text?`<p>${text}</p>`:''}${f}<div class="err" hidden></div><div class="mb"><button type="button" class="btn ghost" data-x>${esc(cancel)}</button>${hideOk?'':`<button class="btn ${danger?'danger':'pri'}">${esc(ok)}</button>`}</div></form>`;
  document.body.appendChild(bg);
  const form=bg.firstChild, err=bg.querySelector('.err');
  const close=()=>{ bg.remove(); document.removeEventListener('keydown',esc_); };
  const esc_=e=>{ if(e.key==='Escape') close(); };
  document.addEventListener('keydown',esc_);
  bg.addEventListener('mousedown',e=>{ if(e.target===bg) close(); });
  bg.querySelector('[data-x]').onclick=close;
  form.addEventListener('submit',async e=>{
    e.preventDefault();
    const v={}; fields.forEach(x=>{ const el=form.elements[x.name]; v[x.name]=x.type==='checkbox'?el.checked:el.value.trim(); });
    const r=onOk?await onOk(v):null;
    if(typeof r==='string'){ err.textContent=r; err.hidden=false; return; }
    close();
  });
  const first=form.querySelector('input:not([type=checkbox]),select'); if(first&&!first.readOnly) setTimeout(()=>first.focus(),50);
  return close;
}
function sheet(title,items){
  const bg=document.createElement('div'); bg.className='bg';
  bg.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h3>${esc(title)}</h3></div>`;
  const box=bg.firstChild;
  const close=()=>{ bg.remove(); document.removeEventListener('keydown',k); };
  const k=e=>{ if(e.key==='Escape') close(); };
  document.addEventListener('keydown',k);
  items.filter(Boolean).forEach(it=>{
    const b=document.createElement('button'); b.className='si'+(it.danger?' danger':'')+(it.on?' on':'');
    b.innerHTML=`<span class="ic">${it.icon||''}</span><span>${esc(it.label)}</span>`;
    b.onclick=()=>{ close(); it.fn&&it.fn(); };
    box.appendChild(b);
  });
  bg.addEventListener('mousedown',e=>{ if(e.target===bg) close(); });
  document.body.appendChild(bg);
}
const confirmBox=(title,text,ok,fn)=>modal({title,text,ok,danger:true,onOk:fn});

/* ---------- rendering ---------- */
function hintHTML(s){
  if(s.pw===''&&s.pr==='') return '';
  const w=parseFloat(s.w), pw=parseFloat(s.pw); let d='';
  if(!isNaN(w)&&!isNaN(pw)){
    if(w>pw) d=` <b class="up">▲ +${fmt(w-pw)}${unit()}</b>`;
    else if(w<pw) d=` <b class="dn">▼ ${fmt(w-pw)}${unit()}</b>`;
  }
  return `Last time: ${s.pw!==''?esc(s.pw)+unit():'–'} × ${s.pr!==''?esc(s.pr):'–'}${d}`;
}
function setHTML(s,i){
  const ro=unlocked?'':'readonly';
  return `<div class="set ${s.done?'done':''}" data-i="${i}">
    <button class="chk" data-act="tick" aria-label="Set ${i+1} done" aria-pressed="${s.done}">✓</button>
    <label class="fld w"><input ${ro} data-f="w" inputmode="decimal" placeholder="${s.pw!==''?esc(s.pw):'0'}" value="${esc(s.w)}" aria-label="Set ${i+1} weight"><em>${unit()}</em></label>
    <label class="fld r"><input ${ro} data-f="r" inputmode="numeric" placeholder="${s.pr!==''?esc(s.pr):'0'}" value="${esc(s.r)}" aria-label="Set ${i+1} reps"><em>reps</em></label>
    <div class="hint">${hintHTML(s)}</div></div>`;
}
function exHTML(x){

    <div class="eh">${unlocked?`<button class="grip" data-act="grab" data-drag="ex" aria-label="Drag to reorder exercise">${GRIP}</button>`:''}<span class="en">${esc(x.name)}</span>${x.url?`<a class="vid" href="${esc(x.url)}" target="_blank" rel="noopener noreferrer" aria-label="Watch video for ${esc(x.name)}">▶ ${linkLabel(x.url)}</a>`:''}<span class="ec" data-ecnt></span>

function secHTML(s){

    <div class="sh" data-act="toggle" role="button" tabindex="0" aria-expanded="${!s.collapsed}">

function render(){
  const p=plan();
  if(filter!=='all'&&filter!=='today'&&!p.sections.find(s=>s.id===filter)) filter='all';
  $('#top').innerHTML=`
    <button class="plan" data-act="plans" aria-label="Choose coach plan"><small>Coach plan</small><b>${esc(p.name)} ▾</b></button>
    ${unlocked?`<button class="ib" data-act="planmenu" aria-label="Edit plan: rename or delete">✎</button>`:''}
    <button class="ib ${unlocked?'on':''}" data-act="lock" aria-label="${unlocked?'Lock editing':'Unlock editing'}">${unlocked?'🔓':'🔒'}</button>
    <button class="ib" data-act="menu" aria-label="Menu">☰</button>`;
  const secs=p.sections.filter(s=>filter==='all'||(filter==='today'?s.day===todayName():s.id===filter));
  if(view==='progress'){ $('#app').innerHTML=tabsHTML()+progressHTML(); return; }
  $('#app').innerHTML=`
    ${tabsHTML()}
    <div class="ov">
      <div class="ovt"><div class="big"><span id="ovDone"></span></div>
        <div style="text-align:right"><span class="mode ${unlocked?'edit':''}">${unlocked?'Editing':'View only'}</span><div class="sync" id="sync">${esc(syncMsg)}</div></div></div>
      <div class="bar" id="ovBarWrap"><i id="ovBar"></i></div>
      <div class="ovb"><button class="btn" data-act="rest">⏱ Rest ${S.settings.rest}s</button><button class="btn" data-act="reset">↺ Reset ticks</button></div>
    </div>
    <div class="chips" role="tablist">
      <button class="chip ${filter==='all'?'on':''}" data-act="filter" data-v="all">All</button>
      ${p.sections.some(s=>s.day)?`<button class="chip ${filter==='today'?'on':''}" data-act="filter" data-v="today">Today · ${todayName().slice(0,3)}</button>`:''}
      ${p.sections.map(s=>`<button class="chip ${filter===s.id?'on':''}" data-act="filter" data-v="${s.id}">${esc(s.name)}</button>`).join('')}
    </div>
    ${secs.map(secHTML).join('')||`<div class="empty">${filter==='today'?'No workout is set for today. Use a section’s ⋯ menu → Set day.':unlocked?'This plan has no sections yet. Add the first one below.':'This plan has no sections yet.'}</div>`}
    ${unlocked?`<button class="addsec" data-act="addsec">+ New section</button>`:''}`;
  updateProgress();
}
function counts(list){ let d=0,t=0; list.forEach(x=>x.sets.forEach(s=>{t++; if(s.done)d++;})); return {d,t}; }
function updateProgress(){
  const p=plan(); const all=counts(p.sections.flatMap(s=>s.exercises));
  const od=$('#ovDone'); if(od) od.innerHTML=`${all.d}<span> / ${all.t} sets done</span>`;
  const ob=$('#ovBar'); if(ob){ ob.style.width=(all.t?all.d/all.t*100:0)+'%'; $('#ovBarWrap').classList.toggle('full',all.t>0&&all.d===all.t); }
  p.sections.forEach(s=>{
    const el=document.querySelector(`[data-sec="${s.id}"]`); if(!el) return;
    const c=counts(s.exercises);
    el.querySelector('[data-scnt]').textContent=`${s.exercises.length} exercises · ${c.d}/${c.t} sets`;
    el.querySelector('[data-sbar]').style.width=(c.t?c.d/c.t*100:0)+'%';
    el.querySelector('.sh .bar').classList.toggle('full',c.t>0&&c.d===c.t);
    const ck=el.querySelector('[data-schk]');
    if(ck){ const all=c.t>0&&c.d===c.t, part=c.d>0&&!all; ck.classList.toggle('on',all); ck.classList.toggle('part',part); ck.textContent=part?'–':'✓'; ck.setAttribute('aria-pressed',String(all)); }
    s.exercises.forEach(x=>{
      const xe=el.querySelector(`[data-ex="${x.id}"]`); if(!xe) return;
      const d=x.sets.filter(q=>q.done).length;
      xe.querySelector('[data-ecnt]').textContent=`${d}/${x.sets.length} sets`;
      xe.classList.toggle('alldone',d===x.sets.length&&d>0);
    });
  });
}

/* ---------- rest timer ---------- */
const rest={end:0,total:60,iv:null,hide:null};
let ac;
function audio(){ try{ ac=ac||new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==='suspended') ac.resume(); }catch(e){} }
function beep(){
  if(!S.settings.sound||!ac) return;
  try{ [0,.28,.56].forEach((t,i)=>{
    const o=ac.createOscillator(), g=ac.createGain(); o.frequency.value=i===2?1175:880; o.connect(g); g.connect(ac.destination);
    const n=ac.currentTime+t; g.gain.setValueAtTime(.25,n); g.gain.exponentialRampToValueAtTime(.001,n+.22); o.start(n); o.stop(n+.24);
  }); }catch(e){}
}
function startRest(sec){
  audio(); clearInterval(rest.iv); clearTimeout(rest.hide);
  rest.total=sec; rest.end=Date.now()+sec*1000;
  $('#rest').classList.remove('done'); $('#rest').classList.add('show'); $('#restLbl').textContent='Rest';
  rest.iv=setInterval(tickRest,250); tickRest();
}
function tickRest(){
  if(!rest.end) return;
  const left=Math.max(0,Math.ceil((rest.end-Date.now())/1000));
  $('#restTime').textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');
  $('#restBar').style.width=(rest.total?Math.min(100,left/rest.total*100):0)+'%';
  if(left<=0){
    clearInterval(rest.iv); rest.end=0;
    $('#rest').classList.add('done'); $('#restLbl').textContent='Go – next set!';
    beep(); if(navigator.vibrate) navigator.vibrate([250,120,250]);
    rest.hide=setTimeout(()=>$('#rest').classList.remove('show'),4000);
  }
}
function stopRest(){ clearInterval(rest.iv); clearTimeout(rest.hide); rest.end=0; $('#rest').classList.remove('show'); }
$('#restSkip').onclick=stopRest;
$('#restPlus').onclick=()=>{ if(rest.end){ rest.end+=15000; rest.total+=15; tickRest(); } };
$('#restMinus').onclick=()=>{ if(rest.end){ rest.end-=15000; tickRest(); } };

/* wake lock */
let wl=null;
async function setWake(on){
  try{ if(on&&'wakeLock' in navigator&&!wl){ wl=await navigator.wakeLock.request('screen'); wl.addEventListener('release',()=>wl=null); }
       else if(!on&&wl){ await wl.release(); wl=null; } }catch(e){}
}
document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ tickRest(); if(S.settings.wake) setWake(true); loadServer(); } });
if(S.settings.wake) setWake(true);

/* ---------- actions ---------- */
function resetTicks(secId){
  const p=plan(); const secs=secId?p.sections.filter(x=>x.id===secId):p.sections;
  let entry=null;
  if(!secId){ const b=buildSession(p); if(b.done>0) entry=Object.assign({t:Date.now(),plan:p.name},b); }
  secs.forEach(x=>x.exercises.forEach(e=>e.sets.forEach(st=>{
    if(st.w!=='') st.pw=st.w; if(st.r!=='') st.pr=st.r; st.done=false;
  })));
  let msg='Ticks cleared – your weights are kept';
  if(entry){
    S.history.unshift(entry); S.history=S.history.slice(0,250);
    const prs=exPRs(S.history,0);
    msg=prs.length?`🏆 New PR: ${prs[0].name} ${fmt(prs[0].w)}${unit()}${prs.length>1?' +'+(prs.length-1)+' more':''}`:'Session logged to Progress – weights are kept';
  }
  save(); render(); toast(msg);
}
function clonePlan(p,name){
  const c=JSON.parse(JSON.stringify(p)); c.id=uid(); c.name=name;
  c.sections.forEach(s=>{ s.id=uid(); s.exercises.forEach(x=>{ x.id=uid(); x.sets.forEach(st=>{ st.done=false; }); }); });
  return c;
}
function planItems(){
  return [
    {icon:'✎',label:'Rename this plan',fn:()=>modal({title:'Rename plan',fields:[{name:'name',label:'Plan name',value:plan().name}],
      onOk:v=>{ if(!v.name) return 'Name can’t be empty.'; plan().name=v.name; save(); render(); toast('Plan renamed'); }})},
    {icon:'＋',label:'New coach plan',fn:()=>modal({title:'New coach plan',
      fields:[{name:'name',label:'Plan name',value:''},
        {name:'from',label:'Start from',type:'select',value:'blank',options:[{v:'blank',t:'Empty plan'},{v:'copy',t:'Copy of "'+plan().name+'"'}]}],
      onOk:v=>{ if(!v.name) return 'Give the plan a name.';
        const np=v.from==='copy'?clonePlan(plan(),v.name):{id:uid(),name:v.name,sections:[]};
        S.plans.push(np); S.activePlan=np.id; filter='all'; save(); render(); }})},
    {icon:'⧉',label:'Duplicate this plan',fn:()=>{ const c=clonePlan(plan(),plan().name+' (copy)'); S.plans.push(c); S.activePlan=c.id; save(); render(); toast('Plan duplicated'); }},
    {icon:'🗑',label:'Delete this plan',danger:true,fn:()=>confirmBox('Delete plan?',
      `“${esc(plan().name)}” and all its weights will be removed. This can’t be undone.`+(S.plans.length===1?' An empty plan will be created so you can start again.':''),
      'Delete plan',()=>{
        S.plans=S.plans.filter(q=>q.id!==S.activePlan);
        if(!S.plans.length) S.plans.push({id:uid(),name:'New plan',sections:[]});
        S.activePlan=S.plans[0].id; filter='all'; save(); render(); toast('Plan deleted'); })}

}
function openPlans(){

  bg.addEventListener('mousedown',e=>{ if(e.target===bg) bg.remove(); });
  bg.querySelector('[data-x]').onclick=()=>bg.remove();

function exportData(){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));

let view='workout', prange='week', pmetric='vol', pex='';
const DAY=864e5;
const num=v=>{ const n=parseFloat(v); return isNaN(n)?0:n; };
const fk=n=>n>=10000?Math.round(n/1000)+'k':n>=1000?(n/1000).toFixed(1).replace(/\.0$/,'')+'k':String(Math.round(n));
const sow=d=>{ const x=new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x; };
const addDays=(t,n)=>{ const d=new Date(t); d.setDate(d.getDate()+n); return d.getTime(); };
const shortDate=t=>new Date(t).toLocaleDateString(undefined,{day:'numeric',month:'short'});
const tabsHTML=()=>`<div class="tabs" role="tablist"><button class="tab ${view==='workout'?'on':''}" data-act="tab" data-v="workout" role="tab">Workout</button><button class="tab ${view==='progress'?'on':''}" data-act="tab" data-v="progress" role="tab">Progress</button></div>`;

function buildSession(p){
  let done=0,total=0,vol=0; const sec={}, ex=[];
  p.sections.forEach(sc=>sc.exercises.forEach(x=>{
    let n=0,v=0,top=0,topR=0;
    x.sets.forEach(st=>{
      total++;
      if(st.done){ done++; n++; const w=num(st.w), r=num(st.r); v+=w*r; if(w>top||(w===top&&r>topR)){ top=w; topR=r; } }
    });
    if(n){ vol+=v; const k=sec[sc.name]||(sec[sc.name]={s:0,v:0}); k.s+=n; k.v+=Math.round(v); ex.push([x.name,n,top,topR,Math.round(v),sc.name]); }
  }));
  return {done,total,vol:Math.round(vol),sec,ex};
}
function exPRs(hist,i){
  const h=hist[i]; if(!h||!h.ex) return [];
  const older=hist.slice(i+1), out=[];
  h.ex.forEach(e=>{
    const name=e[0], top=e[2]; if(!(top>0)) return;
    let prev=0, seen=false;
    older.forEach(o=>(o.ex||[]).forEach(q=>{ if(q[0]===name){ seen=true; if(q[2]>prev) prev=q[2]; } }));
    if(seen&&top>prev) out.push({name,w:top,r:e[3]});
  });
  return out;
}
function agg(list){ return list.reduce((a,h)=>({n:a.n+1,sets:a.sets+h.done,vol:a.vol+h.vol}),{n:0,sets:0,vol:0}); }
function delta(c,p){

  const d=Math.round((c-p)/p*100);
  return d===0?'<b>no change</b>':`<b class="${d>0?'up':'dn'}">${d>0?'▲':'▼'} ${Math.abs(d)}%</b>`;
}
function weekStreak(goal){
  const counts={}; S.history.forEach(h=>{ const k=sow(h.t).getTime(); counts[k]=(counts[k]||0)+1; });
  let w=sow(Date.now()).getTime(), streak=0;
  if((counts[w]||0)<goal) w=sow(addDays(w,-7)).getTime();
  while((counts[w]||0)>=goal){ streak++; w=sow(addDays(w,-7)).getTime(); }
  return streak;
}
function bounds(){
  const now=Date.now(), w0=sow(now).getTime();
  if(prange==='week') return {from:w0,to:addDays(w0,7),pf:addDays(w0,-7),pt:w0,title:'This week',vs:'last week'};
  if(prange==='month') return {from:addDays(now,-30),to:now+1,pf:addDays(now,-60),pt:addDays(now,-30),title:'Last 30 days',vs:'the 30 days before'};
  if(prange==='quarter') return {from:addDays(now,-90),to:now+1,pf:addDays(now,-180),pt:addDays(now,-90),title:'Last 90 days',vs:'the 90 days before'};
  return {from:0,to:now+1,pf:null,pt:null,title:'All time',vs:''};
}
function buckets(){
  const H=S.history, val=h=>pmetric==='sets'?h.done:h.vol, now=Date.now(), w0=sow(now).getTime(), out=[];
  const sum=(a,z)=>H.filter(h=>h.t>=a&&h.t<z).reduce((t,h)=>t+val(h),0);
  if(prange==='week'){
    const L=['M','T','W','T','F','S','S'], ti=(new Date().getDay()+6)%7;
    for(let i=0;i<7;i++) out.push({l:L[i],v:sum(addDays(w0,i),addDays(w0,i+1)),cur:i===ti});
    return {unit:'per day',bars:out};
  }
  if(prange==='month'||prange==='quarter'){
    const n=prange==='month'?5:13;
    for(let i=n-1;i>=0;i--){ const a=sow(addDays(w0,-7*i)).getTime(); out.push({l:(n<6||i%3===0)?shortDate(a):'',v:sum(a,addDays(a,7)),cur:i===0}); }
    return {unit:'per week',bars:out};
  }
  const first=H.length?Math.min(...H.map(h=>h.t)):now, end=new Date();
  let m=new Date(end.getFullYear(),end.getMonth()-11,1); const fm=new Date(new Date(first).getFullYear(),new Date(first).getMonth(),1); if(m<fm) m=fm;
  while(m<=end){
    const a=m.getTime(), nx=new Date(m.getFullYear(),m.getMonth()+1,1);
    out.push({l:m.toLocaleDateString(undefined,{month:'short'}),v:sum(a,nx.getTime()),cur:m.getMonth()===end.getMonth()&&m.getFullYear()===end.getFullYear()});
    m=nx;

}

    ${muscle.length?muscle.map(x=>{ const v=pmetric==='sets'?x.s:x.v; return `<div class="mr"><span>${esc(x.name)}</span><div class="mt"><i style="width:${Math.round(v/mMax*100)}%"></i></div><em>${pmetric==='sets'?x.s+' sets':fk(x.v)} · ${mTot?Math.round(v/mTot*100):0}%</em></div>`; }).join('')
      :`<p class="mute" style="margin-top:10px">${cur.length?'Muscle-group detail is recorded for workouts logged from now on.':'No sessions in this period.'}</p>`}
    ${muscle.length&&missing.length?`<p class="mute" style="margin-top:12px">Not trained in this period: ${missing.map(esc).join(', ')}</p>`:''}</div>
  ${exerciseHTML()}
  ${prs.length?`<div class="panel"><h3>Personal records</h3><p class="mute">${esc(b.title)}</p>${prs.slice(0,6).map(x=>`<div class="prl">🏆 <b>${esc(x.name)}</b> ${fmt(x.w)}${U}${x.r?' × '+fmt(x.r):''} <small>· ${shortDate(x.t)}</small></div>`).join('')}</div>`:''}
  <div class="panel"><h3>Recent sessions</h3>
    ${H.slice(0,6).map((h,i)=>{ const n=exPRs(H,i).length; return `<div class="srow"><div class="a"><b>${new Date(h.t).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'})}${n?` · 🏆 ${n}`:''}</b><small>${esc(h.plan)} · ${h.done}/${h.total} sets</small></div><div class="r">${fk(h.vol)} ${U}</div>${unlocked?`<button class="ib" data-act="delsess" data-t="${h.t}" aria-label="Delete session">🗑</button>`:''}</div>`; }).join('')}
  </div>`;
}

/* ---------- drag & drop (touch + mouse) ---------- */
document.addEventListener('pointerdown',e=>{
  const h=e.target.closest('[data-drag]'); if(!h||!unlocked) return;
  if(e.pointerType==='mouse'&&e.button!==0) return;
  startDrag(e,h);
});
function secTarget(el,y){
  const sibs=[...document.querySelectorAll('[data-sec]')].filter(x=>x!==el);
  if(!sibs.length) return null;
  for(const sb of sibs){ const r=sb.getBoundingClientRect(); if(y<r.top+r.height/2) return {before:sb.dataset.sec,y:r.top-6,x:r.left,w:r.width}; }
  const r=sibs[sibs.length-1].getBoundingClientRect(); return {before:null,y:r.bottom+6,x:r.left,w:r.width};
}
function exTarget(el,y){
  for(const sEl of document.querySelectorAll('[data-sec]')){
    const r=sEl.getBoundingClientRect(); if(!r.height) continue;
    if(y<r.top-6||y>r.bottom+6) continue;
    const closed=sEl.classList.contains('closed');
    const exs=closed?[]:[...sEl.querySelectorAll('[data-ex]')].filter(x=>x!==el);
    for(const x of exs){ const xr=x.getBoundingClientRect(); if(y<xr.top+xr.height/2) return {sec:sEl.dataset.sec,before:x.dataset.ex,y:xr.top,x:xr.left,w:xr.width}; }
    if(exs.length){ const xr=exs[exs.length-1].getBoundingClientRect(); return {sec:sEl.dataset.sec,before:null,y:xr.bottom,x:xr.left,w:xr.width}; }
    const hr=sEl.querySelector('.sh').getBoundingClientRect(); return {sec:sEl.dataset.sec,before:null,y:hr.bottom,x:hr.left,w:hr.width};
  }
  return null;
}
function startDrag(e,h){
  e.preventDefault();
  const kind=h.dataset.drag;
  const el=h.closest(kind==='sec'?'[data-sec]':'[data-ex]'); if(!el) return;
  const id=kind==='sec'?el.dataset.sec:el.dataset.ex;
  try{ h.setPointerCapture(e.pointerId); }catch(err){}
  let lastY=e.clientY, dy=0, target=null, raf=0, alive=true;
  const line=document.createElement('div'); line.className='dropline'; line.hidden=true; document.body.appendChild(line);
  document.body.classList.add('dragging-'+kind); if(kind==='sec') document.body.classList.add('sorting');
  el.classList.add('dragging'); if(navigator.vibrate) navigator.vibrate(12);
  const frame=()=>{
    if(!alive) return;
    if(lastY<90) window.scrollBy(0,-14); else if(lastY>window.innerHeight-90) window.scrollBy(0,14);
    const base=el.getBoundingClientRect().top-dy;
    dy=lastY-base-22; el.style.transform=`translateY(${dy}px)`;
    target=kind==='sec'?secTarget(el,lastY):exTarget(el,lastY);
    if(target){ line.hidden=false; line.style.left=target.x+'px'; line.style.width=target.w+'px'; line.style.top=(target.y-2)+'px'; } else line.hidden=true;
    raf=requestAnimationFrame(frame);
  };
  const mv=ev=>{ lastY=ev.clientY; };
  const end=ev=>{
    alive=false; cancelAnimationFrame(raf);
    h.removeEventListener('pointermove',mv); h.removeEventListener('pointerup',end); h.removeEventListener('pointercancel',end);
    line.remove(); el.classList.remove('dragging'); el.style.transform='';
    document.body.classList.remove('dragging-'+kind,'sorting');
    if(target&&ev.type==='pointerup') applyDrop(kind,id,target); else render();
  };
  h.addEventListener('pointermove',mv); h.addEventListener('pointerup',end); h.addEventListener('pointercancel',end);
  frame();
}
function applyDrop(kind,id,t){
  const p=plan();
  if(kind==='sec'){
    const i=p.sections.findIndex(x=>x.id===id); if(i<0) return render();
    const [moved]=p.sections.splice(i,1);
    const j=t.before?p.sections.findIndex(x=>x.id===t.before):p.sections.length;
    p.sections.splice(j<0?p.sections.length:j,0,moved);
  }else{
    const f=findEx(id); if(!f) return render();
    f.sec.exercises.splice(f.i,1);
    const to=findSec(t.sec); const j=t.before?to.exercises.findIndex(x=>x.id===t.before):to.exercises.length;
    to.exercises.splice(j<0?to.exercises.length:j,0,f.ex); to.collapsed=false;
  }
  save(); render();
}

render();
loadServer();
</script>
